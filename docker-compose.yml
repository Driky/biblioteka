version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: webtoon_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webtoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-webtoon_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webtoon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  render-server:
    build:
      context: ./render-server
      dockerfile: Dockerfile
    container_name: webtoon_render
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  phoenix:
    build:
      context: ./phoenix_app
      dockerfile: Dockerfile
    container_name: webtoon_phoenix
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-webtoon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-webtoon_prod}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?required}
      PHX_HOST: ${PHX_HOST:?required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?required}
      R2_BUCKET: ${R2_BUCKET:?required}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:?required}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: webtoon_scraper
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-webtoon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-webtoon_prod}
      RENDER_SERVER_URL: http://render-server:3000/render
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
      render-server:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
